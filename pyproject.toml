[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nexusrcm"
version = "0.1.0"
description = "Industrial failure knowledge engine for ingestion, NLP, graph retrieval, and GraphRAG workflows."
readme = "README.md"
requires-python = ">=3.12"
authors = [
  { name = "Igor Pereira" }
]
dependencies = [
  "pydantic>=2.7,<3.0",
  "pydantic-settings>=2.2,<3.0",
  "pandas>=2.2,<3.0",
  "PyMuPDF>=1.24,<2.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.2,<9.0",
  "pytest-cov>=5.0,<6.0",
  "ruff>=0.4,<0.5",
  "mypy>=1.10,<2.0",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
nexusrcm = ["py.typed"]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "--cov=src/nexusrcm --cov-report=term-missing"

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_configs = true
